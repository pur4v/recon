name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck the secret scanner
        run: shellcheck skills/recon/scripts/scan_secrets.sh

      - name: Syntax-check the Node scripts
        run: |
          for f in skills/recon/scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Validate plugin, marketplace & package manifests are JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json package.json; do
            echo "checking $f"
            python3 -c "import json,sys; json.load(open('$f'))"
          done

      - name: Validate SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          text = pathlib.Path("skills/recon/SKILL.md").read_text()
          m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
          if not m:
              sys.exit("SKILL.md is missing YAML frontmatter")
          fm = m.group(1)
          for key in ("name", "description"):
              if not re.search(rf'^{key}:', fm, re.M):
                  sys.exit(f"SKILL.md frontmatter missing required key: {key}")
          print("SKILL.md frontmatter OK")
          PY

      - name: Check slash commands have descriptions
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path("commands").glob("*.md")):
              text = p.read_text()
              m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
              if not m or not re.search(r'^description:', m.group(1), re.M):
                  bad.append(p.name)
          if bad:
              sys.exit("commands missing frontmatter description: " + ", ".join(bad))
          print("all commands have a description")
          PY

      - name: Guard against committed secrets / session state
        run: |
          bash skills/recon/scripts/scan_secrets.sh . || true
          # Fail if any storageState / .auth / .recon artifacts were committed.
          if git ls-files | grep -E '(^|/)\.recon/|(^|/)\.auth/|storageState' ; then
            echo "ERROR: capture/session artifacts are tracked — they must be gitignored."
            exit 1
          fi
          echo "no capture/session artifacts tracked"
